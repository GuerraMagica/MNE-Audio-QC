[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mne-qc-inspector"
version = "0.1.0"
description = "Local experimental M&E comparison and QC evidence"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "soundfile>=0.13"]

[project.scripts]
mne-qc = "mne_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
